services:
  postgres:
    image: postgres:16-alpine
    container_name: loopcraft-postgres
    environment:
      POSTGRES_USER: loopcraft
      POSTGRES_PASSWORD: loopcraft_local_dev
      POSTGRES_DB: loopcraft
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loopcraft -d loopcraft"]
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data
