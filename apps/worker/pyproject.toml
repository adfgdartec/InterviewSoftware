[project]
name = "loopcraft-worker"
version = "0.1.0"
description = "Loopcraft FastAPI media + analysis worker (phase 0 skeleton: delivery metrics only, no video/face processing)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.128.0",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.5",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "httpx==0.28.1",
    "ruff==0.9.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["loopcraft_worker*"]
