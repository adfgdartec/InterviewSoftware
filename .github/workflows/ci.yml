name: ci

on:
  push:
    # The three environment branches. A push to any of them also triggers deploy.yml, which
    # runs its own faster subset -- this is the full suite, including Postgres and Ollama.
    branches: [main, staging, test]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Loopcraft does not use Docker. Postgres runs as a native cluster; the code sandbox
      # is macOS Seatbelt, which is why the sandbox job below runs on macOS.
      #
      # No DATABASE_URL is set for this job. Every db-backed test suite defaults to
      # `loopcraft_test` (packages/db/src/env.ts's DEFAULT_LOCAL_URL) precisely so a test run
      # can never collide with a real dev/demo database -- CI has no dev server to protect,
      # but using the same default here that a contributor's machine uses is what makes
      # "it passed locally" and "it passed in CI" mean the same thing. Turborepo's strict env
      # mode strips undeclared env vars from task processes (see turbo.json's `test` task),
      # so a job-level DATABASE_URL override here would silently be dropped by `turbo run
      # test` anyway -- this job previously set one pointing at `loopcraft`, which the test
      # task never actually saw, while the setup step below only ever created `loopcraft`,
      # not the `loopcraft_test` every test suite actually connects to. That mismatch is
      # exactly what broke this job.
      - name: start native postgres
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-16
          export PATH="/usr/lib/postgresql/16/bin:$PATH"
          initdb -D "$PWD/.pgdata" -U loopcraft --auth=trust
          pg_ctl -D "$PWD/.pgdata" -o "-p 54329 -k /tmp" -l "$PWD/.pgdata/server.log" start
          until pg_isready -h 127.0.0.1 -p 54329 -U loopcraft; do sleep 1; done
          psql -h 127.0.0.1 -p 54329 -U loopcraft -d postgres -c 'create database loopcraft_test'

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Guardrail 1: the affect-inference gate must fail the build, not warn.
      - name: lint (includes no-affect-inference)
        run: pnpm exec eslint .

      - name: typecheck
        run: pnpm run typecheck

      # apps/web/test/interviewer.test.ts and interviewer-route.e2e.test.ts talk to a real
      # Ollama model rather than mocking one, deliberately -- same "fail, don't silently skip"
      # principle as the sandbox escape suite below, so a green run actually proves the
      # interviewer works. packages/providers/src/registry.ts's `interviewer_turn` purpose is
      # the only one these two files exercise, so only that one model (not the larger grading
      # model) needs to be present here.
      - name: cache ollama models
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-models-llama3.2-latest-v1
      - name: install ollama and pull llama3.2:latest
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:11434/api/version >/dev/null 2>&1 && break
            sleep 1
          done
          ollama pull llama3.2:latest

      # Spec §3.5 unit + contract + integration layers. Excludes @loopcraft/sandbox: its
      # escape suite requires macOS Seatbelt and is designed to FAIL (not skip) without it --
      # exactly what happened here before this exclusion existed. That suite already has its
      # own dedicated macOS runner below; running it again on ubuntu can only ever fail.
      - name: unit and integration tests
        run: pnpm exec turbo run test --concurrency=1 --filter='!@loopcraft/sandbox'

      # Acceptance criterion 6, called out separately so a failure is unmissable in the log.
      - name: RLS cross-tenant denial
        run: pnpm run test:rls

      - name: accessibility (axe)
        run: pnpm --filter @loopcraft/web test:a11y

  # The code sandbox is macOS Seatbelt (sandbox-exec), so its escape suite can only run on a
  # macOS runner. It fails rather than skips when the tooling is absent, deliberately.
  sandbox:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # packages/sandbox/src/limits.ts hardcodes PYTHON_BINARY at the standard Homebrew path
      # for the confined interpreter (matching local dev setup); `actions/setup-python` does
      # not install there, so the sandboxed process failed with execvp() "No such file or
      # directory" -- Seatbelt's `(allow process-exec)` only allows exec of a binary that
      # actually exists, and the escape suite correctly reported that as a real failure
      # rather than silently passing on a broken confinement target.
      - run: brew install python@3.12
      - name: sandbox escape suite
        run: pnpm --filter @loopcraft/sandbox test

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
      - name: worker tests (includes the banned-token mirror)
        run: pytest -q
